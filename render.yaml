services:
  - type: web
    name: safar-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Safar API
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_MODEL
        value: sarvam-105b
      - key: SERPAPI_API_KEY
        sync: false
      - key: RAILRADAR_API_KEY
        sync: false
      - key: RAILRADAR_BASE_URL
        value: https://api.railradar.in
      - key: AMADEUS_CLIENT_ID
        sync: false
      - key: AMADEUS_CLIENT_SECRET
        sync: false
      - key: AMADEUS_ENV
        value: production
      - key: NOMINATIM_BASE_URL
        value: https://nominatim.openstreetmap.org
      - key: OVERPASS_BASE_URL
        value: https://overpass-api.de/api
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: TRAVEL_PROVIDER_MODE
        value: auto
      - key: ENABLE_RESILIENCE_DEMO
        value: "true"
      - key: AUTH_DISABLED
        value: "false"
