[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "glance-fashion-retrieval"
version = "0.1.0"
description = "Attribute-aware multimodal fashion and context retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Glance ML Internship Assignment" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "qdrant-client>=1.12,<2",
  "numpy>=1.26,<3",
  "Pillow>=10.4,<12",
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
ml = [
  "torch>=2.4",
  "transformers>=4.48",
  "accelerate>=1.2",
  "peft>=0.14",
  "safetensors>=0.4",
  "open-clip-torch>=2.29",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.8",
]

[project.scripts]
glance = "glance_retrieval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/glance_retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI dependencies and Typer options are intentionally framework-provided defaults;
# model prompts/configuration also benefit from readable long literals over artificial wrapping.
ignore = ["B008", "E501"]
